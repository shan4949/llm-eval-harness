[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # CLI + API
    "typer>=0.12.3",
    "rich>=13.7.1",
    # Web / SUT
    "fastapi>=0.111.1",
    "uvicorn[standard]>=0.30.1",
    "httpx>=0.27.0",
    # LLM APIs
    "anthropic>=0.31.1",
    "openai>=1.35.0",
    # Vector store
    "chromadb>=0.5.3",
    # Database
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    # Config / validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    # Observability
    "structlog>=24.2.0",
    # Statistics
    "scipy>=1.13.1",
    "numpy>=1.26.4",
    # Dashboard
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
]

[project.scripts]
evalharness = "evalharness.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.1",
    "mypy>=1.10.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evalharness*", "sut*", "dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
