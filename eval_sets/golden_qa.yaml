# Golden QA test set for FOMC RAG pipeline
# Format:
#   id: unique identifier
#   question: what we ask the SUT
#   expected: what a correct answer contains (used by evaluators)
#   keywords: list of terms that must appear in a passing answer
#   expected_idk: true if the correct answer is "I don't know" (out-of-corpus)
#   tags: for filtering/grouping
#   source: which FOMC file contains the answer

