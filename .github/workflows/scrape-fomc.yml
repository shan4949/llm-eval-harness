name: Scrape FOMC Statements

on:
  schedule:
    - cron: "0 9 1 * *"   # 9am UTC on the 1st of every month
  workflow_dispatch:       # lets you trigger it manually from GitHub

permissions:
  contents: write          # needed so the job can git push new files back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4

      - name: Run scraper
        run: python scripts/scrape_fomc.py

      - name: Commit new files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull origin main
          git add sut/data/
          if git diff --staged --quiet; then
            echo "No new statements — nothing to commit"
          else
            git commit -m "chore: add new FOMC statements"
            git push
          fi
