name: Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      set_baseline:
        description: "Mark this run as the new baseline"
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evalharness
          POSTGRES_USER: eval
          POSTGRES_PASSWORD: eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eval:eval@localhost:5432/evalharness
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply schema
        run: psql "$DATABASE_URL" -f evalharness/storage/schema.sql

      - name: Index FOMC documents
        run: python -c "from sut.retriever import Retriever; r = Retriever(); r.index()"

      - name: Start SUT server
        run: uvicorn sut.app:app --port 8000 &
        # give it a moment to start
      - run: sleep 3

      - name: Run eval (no LLM judge in CI — faster and cheaper)
        run: evalharness run --eval-set golden_qa --no-judge

      - name: Fetch baseline run ID
        id: baseline
        run: |
          BASELINE_ID=$(psql "$DATABASE_URL" -tAc \
            "SELECT run_id FROM eval_runs WHERE is_baseline=TRUE ORDER BY run_id DESC LIMIT 1;")
          echo "id=${BASELINE_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch candidate run ID
        id: candidate
        run: |
          CAND_ID=$(psql "$DATABASE_URL" -tAc \
            "SELECT run_id FROM eval_runs ORDER BY run_id DESC LIMIT 1;")
          echo "id=${CAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Compare to baseline (skip if no baseline yet)
        if: steps.baseline.outputs.id != ''
        run: |
          evalharness compare \
            --baseline ${{ steps.baseline.outputs.id }} \
            --candidate ${{ steps.candidate.outputs.id }}

      - name: Promote to baseline (if requested or first run)
        if: github.event.inputs.set_baseline == 'true' || steps.baseline.outputs.id == ''
        run: |
          psql "$DATABASE_URL" -c \
            "UPDATE eval_runs SET is_baseline=TRUE WHERE run_id=${{ steps.candidate.outputs.id }};"
          echo "Run ${{ steps.candidate.outputs.id }} is now the baseline."
