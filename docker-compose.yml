services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evalharness
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./evalharness/storage/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evalharness"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://eval:eval@postgres:5432/evalharness
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    profiles: ["app"]   # opt-in; postgres starts without it

volumes:
  postgres_data:
